.day-picker { background: #fff; border-bottom: 2px solid #e0e4ec; padding: 14px 20px; }
.section-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #888; margin-bottom: 10px; }
.day-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
.day-btn {
  padding: 9px 14px; border: 2px solid #001D46; border-radius: 6px;
  cursor: pointer; background: #fff; color: #001D46;
  font-family: Arial, sans-serif; font-size: 12px; font-weight: 700;
  text-transform: uppercase; transition: all 0.15s; text-align: center; line-height: 1.4; min-width: 90px;
}
.day-btn:hover { background: #001D46; color: #fff; }
.day-btn.active { background: #001D46; color: #FFCC00; }
.day-btn.event { border-color: #D2003C; color: #D2003C; }
.day-btn.event:hover { background: #D2003C; color: #fff; }
.day-btn.event.active { background: #D2003C; color: #fff; border-color: #D2003C; }
.day-btn .date { font-size: 13px; display: block; }
.day-btn .label { font-size: 9px; opacity: 0.7; display: block; margin-top: 2px; }

.filter-bar {
  background: #fff; padding: 10px 20px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid #e0e4ec; flex-wrap: wrap;
}
.filter-label { font-size: 11px; font-weight: 700; color: #001D46; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
.filter-select {
  padding: 6px 10px; border: 1.5px solid #9FAEE5; border-radius: 5px;
  font-size: 12px; color: #001D46; background: #f8f9fc; cursor: pointer; font-family: Arial, sans-serif;
}
.row-count { margin-left: auto; font-size: 11px; color: #888; }

.schedule-area { padding: 16px 20px 80px; }
.legend { background: #fff; border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.legend-items { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.legend-pill { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
.sched-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.sched-table thead tr { background: #001D46; }
.sched-table thead th { padding: 10px 12px; text-align: left; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #9FAEE5; white-space: nowrap; }
.sched-table tbody tr { border-bottom: 1px solid rgba(0,0,0,0.05); transition: filter 0.1s; }
.sched-table tbody tr:hover { filter: brightness(0.96); }
.sched-table td { padding: 9px 12px; vertical-align: middle; }
.td-time { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.td-finish { font-size: 10px; opacity: 0.6; }
.dept-pill { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
.td-action { font-size: 13px; font-weight: 600; }
.td-resp { font-size: 11px; opacity: 0.75; }
.td-loc { font-size: 11px; font-weight: 600; white-space: nowrap; }
